<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <script src="i18n.js"></script>
  <script src="embed.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ดูไพ่ทาโรต์ — หมอดู.com</title>
  <meta name="description" content="เปิดไพ่ทาโรต์ออนไลน์ เลือกรูปแบบการเปิดไพ่ สับไพ่ จั่วไพ่ และอ่านคำทำนาย">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Kanit:wght@300;400;500;600&family=Charm:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tarot.css">
</head>
<body class="ready">
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>

  <header class="topbar">
    <a href="index.html" class="logo"><span class="logo-eye">☾</span> หมอดู<span class="dot">.com</span></a>
    <nav class="top-actions">
      <a class="nav-link" href="services.html">บริการ</a>
      <a class="nav-link" href="tarot.html" aria-current="page">ไพ่ทาโรต์</a>
      <a class="nav-link" href="siamsi.html">เซียมซี</a>
    </nav>
  </header>

  <main class="tarot">
    <div class="tarot-head">
      <p class="eyebrow">✦ THE ARCANA ✦</p>
      <h1 class="page-title">ไพ่ทาโรต์</h1>
      <p class="subtitle" id="stepHint">ตั้งคำถามในใจ แล้วเลือกรูปแบบการเปิดไพ่</p>
    </div>

    <!-- ขั้นที่ 1: เลือกรูปแบบ -->
    <section class="step" id="stepSpread">
      <label class="question">
        <span>คำถามของคุณ <small>(ไม่บังคับ)</small></span>
        <input id="question" type="text" maxlength="120" placeholder="เช่น งานใหม่ที่กำลังจะเริ่มจะเป็นอย่างไร?">
      </label>
      <div class="deck-choice" role="radiogroup" aria-label="สำรับไพ่">
        <label><input type="radio" name="deck" value="full" checked><span>ไพ่ครบสำรับ 78 ใบ</span></label>
        <label><input type="radio" name="deck" value="major"><span>เฉพาะไพ่ชุดใหญ่ 22 ใบ</span></label>
      </div>
      <div class="spreads" id="spreads"></div>
    </section>

    <!-- ขั้นที่ 2: สับและจั่วไพ่ -->
    <section class="step" id="stepDraw" hidden>
      <div class="slots" id="slots"></div>
      <div class="deck-area">
        <div class="deck" id="deck"></div>
        <div class="fan" id="fan"></div>
      </div>
      <div class="actions">
        <button class="btn-gold big" id="shuffleBtn">✧ สับไพ่ ✧</button>
        <button class="btn-gold big" id="revealBtn" hidden>✧ เปิดไพ่ ✧</button>
      </div>
    </section>

    <!-- ขั้นที่ 3: คำทำนาย -->
    <section class="step" id="stepResult" hidden>
      <p class="your-q" id="yourQ" hidden></p>
      <div class="readings" id="readings"></div>
      <div class="summary" id="summary"></div>
      <div class="actions">
        <button class="btn-gold big" id="againBtn">✧ เปิดไพ่ใหม่ ✧</button>
        <a class="btn-ghost big" href="index.html">กลับหน้าแรก</a>
      </div>
      <p class="disclaimer">คำทำนายมีไว้เพื่อความบันเทิงและเป็นแนวทางสะท้อนตัวเอง ไม่ควรใช้แทนคำปรึกษาจากผู้เชี่ยวชาญ</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="common.js"></script>
  <script src="tarot-data.js"></script>
  <script src="tarot.js"></script>
</body>
</html>
